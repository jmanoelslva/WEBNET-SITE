# Cabeçalhos de segurança do site da WebNet (Apache).
# Incluído pela configuração criada pelo instalar.sh: alterações aqui valem após "webnet-atualizar".
# CSP: só carrega recursos do próprio site, do VLibras (governo federal; o avatar roda num iframe
# de vlibras.gov.br e exige 'unsafe-eval'/'wasm-unsafe-eval') e das estatísticas GoatCounter.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; img-src 'self' data: blob: https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; font-src 'self' data: https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; connect-src 'self' blob: data: https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net https://*.goatcounter.com; frame-src https://vlibras.gov.br https://*.vlibras.gov.br; worker-src 'self' blob:; media-src 'self' blob: https://vlibras.gov.br https://*.vlibras.gov.br https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
